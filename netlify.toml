# ArcVest — Netlify build configuration
# Mountain Engineering · Mountain Capital, LLC

[build]
  # HTML files live in Docs/ — serve from there
  publish = "Docs"

# ── Ignored files — do not trigger a rebuild ─────────────────────────────────
# The engine (SureBetAim.R) pushes JSON data files to Docs/data/ every morning.
# These are pure data updates — no HTML rebuild needed. Without this rule,
# every morning Aim run consumes a full Netlify build credit unnecessarily.
#
# HTML, CSS, JS, and manifest changes still trigger rebuilds normally.
[build.environment]
  NETLIFY_PLUGIN_IGNORE_ENABLED = "true"

[context.production]
  ignore = """
    git diff --quiet HEAD^ HEAD -- 'Docs/data/'
  """

# ── Redirect rules ────────────────────────────────────────────────────────────
# Clean URLs: /scorecard → /scorecard.html etc.
# Uncomment when ready — requires testing to confirm no nav conflicts.
# [[redirects]]
#   from = "/:page"
#   to   = "/:page.html"
#   status = 200

# ── Cache headers — long cache for data files, short for HTML ────────────────
# Data files update daily; aggressive caching would serve stale JSON.
# HTML files change infrequently; moderate caching is fine.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=60"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=300"

[[headers]]
  for = "/arcvest.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/arcvest-components.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
