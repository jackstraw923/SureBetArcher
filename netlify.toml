# ArcVest — Netlify build configuration
# Mountain Engineering · Mountain Capital, LLC

[build]
  publish = "Docs"

# ── Skip build only when ALL changes are inside Docs/data/ ───────────────────
# The ignore script exits 0 (skip) only when git diff finds zero changes
# outside Docs/data/. If any HTML/CSS/JS changed alongside data files,
# the build fires normally.
#
# Previous version used --quiet flag which caused all deploys to be
# canceled rather than just data-only pushes. Fixed 2026-05-05.
[context.production]
  ignore = """
    changed=$(git diff --name-only HEAD^ HEAD | grep -v '^Docs/data/' | wc -l)
    [ "$changed" -eq 0 ]
  """

# ── Cache headers ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=60"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=300"

[[headers]]
  for = "/arcvest.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/arcvest-components.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
